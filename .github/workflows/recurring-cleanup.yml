name: Recurring Cleanup

on:
  schedule:
    - cron: '0 4 * * *'
  workflow_dispatch:

jobs:
  scan-and-grade:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'

      - name: Setup Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Install npm dependencies
        run: npm ci

      - name: Run scanner
        run: make scan > scan-report.json

      - name: Update quality grade
        run: make grade

      - name: Commit grade update
        run: |
          git config user.name "cleanup-bot"
          git config user.email "cleanup-bot@noreply"
          git add docs/generated/quality-grade.json
          git diff --cached --quiet || git commit -m "chore: update quality grade"
          git push

  open-cleanup-prs:
    needs: scan-and-grade
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'

      - name: Setup Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Install npm dependencies
        run: npm ci

      - name: Generate cleanup PRs
        run: cargo build --release --manifest-path harness/Cargo.toml && ./harness/target/release/harnesscli cleanup fix
        env:
          CLEANUP_APPLY: '1'
          CLEANUP_OPEN_PRS: '1'
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
