[package]
name = "discode-daemon-rs"
version = "0.1.0"
edition = "2021"
license = "MIT"
description = "Rust daemon process manager for Discode"

[dependencies]
base64 = "0.22"
ctrlc = "3.4"
fs2 = "0.4"
libc = "0.2"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"

[target.'cfg(unix)'.dependencies]
nix = { version = "0.29", default-features = false, features = ["signal"] }
